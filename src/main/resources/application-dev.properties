# Development Configuration
# This file ensures OpenAPI/Swagger is enabled and properly configured for development

# Enable OpenAPI documentation and UI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# OpenAPI UI configuration for development
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# API documentation path
springdoc.api-docs.path=/v3/api-docs

# Group API endpoints logically
springdoc.group-configs[0].group=openelis-core-api
springdoc.group-configs[0].display-name=OpenELIS Core REST API
springdoc.group-configs[0].paths-to-match=/rest/**

springdoc.group-configs[1].group=openelis-fhir-api  
springdoc.group-configs[1].display-name=OpenELIS FHIR R4 API
springdoc.group-configs[1].paths-to-match=/fhir/**

springdoc.group-configs[2].group=openelis-common-api
springdoc.group-configs[2].display-name=OpenELIS Common/Utility API
springdoc.group-configs[2].paths-to-match=/common/**,/config/**,/util/**

# Enable detailed error responses for development
springdoc.show-actuator=false
springdoc.use-management-port=false